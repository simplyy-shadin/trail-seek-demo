name: iOS build

# Flutter cannot compile iOS apps on Linux (it drives Xcode), and xtool only
# builds SwiftPM packages, not Flutter's Xcode project. GitHub's macOS runners
# have Xcode, so this job produces the iOS build without a Mac on the desk.
#
# Unsigned mode (default): builds Runner.app, packs it as an .ipa you can
# sideload with a free Apple ID through Sideloadly or AltStore (7-day certs).
# Signed mode: add the four secrets below and the job exports a TestFlight-
# ready .ipa with your Apple Developer account.
#   IOS_P12_BASE64        distribution certificate (.p12) base64-encoded
#   IOS_P12_PASSWORD      its password
#   IOS_PROFILE_BASE64    App Store / Ad Hoc provisioning profile base64-encoded
#   IOS_TEAM_ID           10-character Apple team id

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [fix/gps-drift-and-group-tracking]
    tags: ['v*']

jobs:
  gps:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/gps-drift-and-group-tracking'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib/features/tracking/track_recorder.dart lib/features/rope/rope_controller.dart lib/features/rope/live_tracking_screen.dart
      - run: flutter test test/track_recorder_test.dart

  ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Decide signing mode
        id: mode
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install signing certificate and profile
        if: steps.mode.outputs.signed == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/trailseek.mobileprovision

      - name: Build unsigned .ipa (sideload)
        if: steps.mode.outputs.signed == 'false'
        run: |
          set -e
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qr trailseek-unsigned.ipa Payload)
          ls -la build/ios/ipa

      - name: Build signed .ipa (TestFlight / Ad Hoc)
        if: steps.mode.outputs.signed == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          flutter build ipa --release --export-options-plist "$RUNNER_TEMP/export.plist"
          ls -la build/ios/ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trailseek-ios
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
