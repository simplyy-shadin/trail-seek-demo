name: Native Android + iOS smoke checks

on:
  pull_request:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile installable debug APK (not production-signed)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: trailseek-android-debug-pr
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-compile:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Refresh CocoaPods sandbox in ephemeral CI checkout
        run: |
          rm -rf ios/Pods ios/Podfile.lock
          (cd ios && pod install --repo-update)
      - name: Compile unsigned iOS app using existing Xcode project
        run: flutter build ios --release --no-codesign
